<meta property="og:description" content="A Keep Calm countdown to the day Britain is supposed to be ready for war. Satire.">

<meta property="og:image" content="https://keepcalm1000.co.uk/api/og">

<style>
  @font-face {
    font-family: 'Oswald';
    src: url('/fonts/Oswald-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }
  :root {
    --red: #D7261E;
    --red-dark: #B51E17;
    --cream: #F4EEE0;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--red-dark);
    color: var(--cream);
    font: 700 16px/1 'Oswald', 'Arial Narrow', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .poster {
    position: relative;
    width: 100vw;
    width: min(100vw, 80svh);
    height: 100vh;
    height: 100svh;
    background: var(--red);
    container-type: size;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2vmin;
    gap: 2.2cqh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .crown { width: 22vmin; width: min(30cqw, 15cqh); line-height: 0; }
  .crown svg { width: 100%; height: auto; }
  .keep { font-size: 9vmin; font-size: min(15cqw, 8cqh); font-weight: 700; }
  .num {
    font-size: 26vmin; font-size: min(42cqw, 25cqh);
    line-height: .95;
    letter-spacing: .02em;
    min-height: .95em;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 7vmin; font-size: min(11cqw, 6cqh); }
  .big { font-size: 8vmin; font-size: min(13cqw, 7.5cqh); line-height: 1.15; }
  .small { font-size: 3vmin; font-size: min(5cqw, 2.6cqh); text-transform: none; letter-spacing: .04em; margin-top: 1.2cqh; }
  .rule { width: 18%; height: 3px; border: 0; background: var(--cream); margin: 1cqh 0; }
  .tagline {
    font-size: 3.2vmin; font-size: min(5cqw, 3cqh);
    line-height: 1.25;
    max-width: 92%;
    text-wrap: balance;
  }
  [data-ready="true"] .count, [data-ready="false"] .ready,
  [data-ready="true"] .rule, [data-ready="true"] .tagline { display: none; }
  .actions { display: flex; gap: 12px; margin-top: 1.5cqh; }
  button {
    font: inherit;
    font-size: 15px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--cream);
    background: transparent;
    border: 2px solid var(--cream);
    border-radius: 2px;
    padding: 10px 16px;
    min-height: 44px;
    cursor: pointer;
  }
  button:hover { background: var(--cream); color: var(--red); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  footer {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: max(10px, env(safe-area-inset-bottom));
    font: 400 11px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
    text-transform: none;
    letter-spacing: 0;
  }
  footer a { color: inherit; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translate(-50%, 8px);
    background: var(--cream);
    color: var(--red);
    padding: 10px 16px;
    font-size: 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main class="poster" id="poster" data-ready="false">
  <span class="crown" id="crown" aria-hidden="true"></span>
  <h1 class="keep">Keep Calm</h1>
  <div class="count">
    <p class="num" id="num"></p>
    <p class="unit">Days to go</p>
    <noscript><p class="small">Turn on JavaScript to see the count.</p></noscript>
  </div>
  <div class="ready">
    <p class="big">We are<br>now ready*</p>
    <p class="small">*probably</p>
  </div>
  <hr class="rule">
  <p class="tagline" id="tagline"></p>
  <div class="actions">
    <button type="button" id="save">Save poster</button>
    <button type="button" id="share">Share</button>
  </div>
  <footer>
    Satire. Countdown based on the Defence Secretary's ‘1,000 days’ op-ed, Oct 2026.
    <a href="https://www.gov.uk/prepare" rel="noopener">Be ready: official household preparedness guidance</a>
  </footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
  import { getState, SITE_URL } from '/lib/countdown.js';
  import { CROWN, crownSvg } from '/lib/crown.js';

  const RED = '#D7261E';
  const CREAM = '#F4EEE0';
  const $ = (id) => document.getElementById(id);

  $('crown').innerHTML = crownSvg(CREAM);

  let state = null;
  let poster = null; // { blob, name } for today, prepared ahead so Share stays inside the tap gesture

  function render() {
    const s = getState();
    if (state && s.isoDate === state.isoDate) return;
    state = s;
    $('poster').dataset.ready = String(s.ready);
    $('num').textContent = s.ready ? '' : String(s.days);
    $('tagline').textContent = s.tagline;
    document.title = s.ready ? 'Keep Calm – We Are Now Ready*' : `Keep Calm – ${s.days} Days to Go`;
    poster = null;
    preparePoster(s);
  }

  // ---- 1080×1350 poster drawn straight to canvas ----

  function spacedText(ctx, text, cx, y, size, spacingEm, maxW) {
    const measure = () => {
      ctx.font = `700 ${size}px Oswald`;
      const widths = [...text].map((ch) => ctx.measureText(ch).width);
      return { widths, total: widths.reduce((a, b) => a + b, 0) + size * spacingEm * (widths.length - 1) };
    };
    let m = measure();
    if (m.total > maxW) { size = Math.floor(size * maxW / m.total); m = measure(); }
    let x = cx - m.total / 2;
    [...text].forEach((ch, i) => { ctx.fillText(ch, x, y); x += m.widths[i] + size * spacingEm; });
  }

  function drawPoster(s) {
    const W = 1080, H = 1350, maxW = 920;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = RED;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = CREAM;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';

    const crownW = 240, scale = crownW / CROWN.width;
    const crownTop = s.ready ? 210 : 140;
    ctx.save();
    ctx.translate((W - crownW) / 2, crownTop);
    ctx.scale(scale, scale);
    for (const d of CROWN.paths) ctx.fill(new Path2D(d), 'evenodd');
    ctx.restore();

    if (s.ready) {
      spacedText(ctx, 'KEEP CALM', W / 2, 590, 150, .08, maxW);
      spacedText(ctx, 'WE ARE', W / 2, 800, 130, .08, maxW);
      spacedText(ctx, 'NOW READY*', W / 2, 960, 140, .06, maxW);
      ctx.globalAlpha = .9;
      spacedText(ctx, '*probably', W / 2, 1050, 48, .04, maxW);
      ctx.globalAlpha = 1;
    } else {
      spacedText(ctx, 'KEEP CALM', W / 2, 470, 150, .08, maxW);
      spacedText(ctx, String(s.days), W / 2, 880, 420, .02, maxW);
      spacedText(ctx, 'DAYS TO GO', W / 2, 1010, 110, .08, maxW);
      ctx.fillRect(W / 2 - 80, 1062, 160, 4);
      spacedText(ctx, s.tagline, W / 2, 1160, 60, .08, maxW);
    }
    ctx.globalAlpha = .8;
    spacedText(ctx, SITE_URL.replace(/^https?:\/\//, '').toUpperCase(), W / 2, 1290, 30, .12, maxW);
    return c;
  }

  async function preparePoster(s) {
    await document.fonts.load('700 100px Oswald');
    const blob = await new Promise((r) => drawPoster(s).toBlob(r, 'image/png'));
    if (state !== s) return;
    const name = s.ready ? 'keep-calm-ready.png' : `keep-calm-${s.days}-days.png`;
    poster = { blob, name };
  }

  async function getPoster() {
    while (!poster) await preparePoster(state);
    return poster;
  }

  // ---- Save / Share ----

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  $('save').addEventListener('click', async () => {
    const { blob, name } = await getPoster();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  $('share').addEventListener('click', async () => {
    const s = state;
    const url = `${SITE_URL}/?d=${s.isoDate}`; // a fresh URL each day so link previews re-scrape
    const text = s.ready ? 'Keep calm. We are now ready*' : `Keep calm. ${s.days} days to go.`;
    const data = { title: 'Keep Calm', text, url };
    // No await before navigator.share when the poster is ready: iOS needs the tap gesture intact.
    const p = poster ?? await getPoster();
    const file = new File([p.blob], p.name, { type: 'image/png' });
    try {
      if (navigator.canShare?.({ files: [file] })) return await navigator.share({ ...data, files: [file] });
      if (navigator.share) return await navigator.share(data);
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
    try {
      await navigator.clipboard.writeText(url);
      toast('Link copied');
    } catch {
      toast(url);
    }
  });

  render();
  setInterval(render, 60_000);
  document.addEventListener('visibilitychange', () => document.hidden || render());
</script>
</body>
</html>
